<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password & PIN Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #login-container, #dashboard, #attack-page {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        #message { margin-top: 15px; color: red; }
    </style>
</head>
<body>

    <!-- LOGIN PAGE -->
    <div id="login-container">
        <h2>Login</h2>

        <button onclick="showPassword()">Login with Password</button>
        <button onclick="showPin()">Login with PIN</button>

        <div id="password-section" style="display:none;">
            <input type="password" id="password" placeholder="Password" />
            <button onclick="verifyPassword()">Submit Password</button>
        </div>

        <div id="pin-section" style="display:none;">
            <input type="password" id="pin" placeholder="PIN" />
            <button onclick="verifyPin()">Submit PIN</button>
        </div>

        <div id="message"></div>
    </div>

    <!-- SUCCESS PAGE -->
    <div id="dashboard" style="display:none;">
        <h2>Login Successful</h2>
        <p>Welcome! Authentication was successful.</p>
        <button onclick="backToLogin()">Logout</button>
    </div>

    <!-- ATTACK PAGE -->
    <div id="attack-page" style="display:none;">
        <h2>Warning</h2>
        <p style="color:red; font-weight:bold;">Suspicious Activity Detected!</p>
        <p id="attack-msg"></p>
        <button onclick="backToLogin()">Back to Login</button>
    </div>

    <script>
        const serverUrl = "http://192.168.1.96:5000/api/auth";

        function showMessage(msg, color="red") {
            const messageEl = document.getElementById("message");
            messageEl.style.color = color;
            messageEl.innerText = msg;
        }

        function showPassword() {
            document.getElementById("password-section").style.display = "block";
            document.getElementById("pin-section").style.display = "none";
            showMessage("");
        }

        function showPin() {
            document.getElementById("pin-section").style.display = "block";
            document.getElementById("password-section").style.display = "none";
            showMessage("");
        }

        function showDashboard() {
            document.getElementById("login-container").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            document.getElementById("attack-page").style.display = "none";
        }

        function showAttack(msg) {
            document.getElementById("login-container").style.display = "none";
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("attack-page").style.display = "block";
            document.getElementById("attack-msg").innerText = msg;
        }

        function backToLogin() {
            document.getElementById("login-container").style.display = "block";
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("attack-page").style.display = "none";
            showMessage("");
        }

        async function verifyPassword() {
            const password = document.getElementById("password").value;
            if(!password) return showMessage("Password required!");

            try {
                const res = await fetch(`${serverUrl}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if(res.ok) {
                    showDashboard();
                } else {
                    showAttack(data.message || "Password login failed!");
                }

            } catch (err) {
                showAttack("Server unreachable!");
            }
        }

        async function verifyPin() {
            const pin = document.getElementById("pin").value;
            if(!pin) return showMessage("PIN required!");

            try {
                const res = await fetch(`${serverUrl}/login/pin`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ pin })
                });

                const data = await res.json();

                if(res.ok) {
                    showDashboard();
                } else {
                    showAttack(data.message || "PIN login failed!");
                }

            } catch (err) {
                showAttack("Server unreachable!");
            }
        }
    </script>
</body>
</html>
